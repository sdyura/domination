/************************/
/** Build Script Setup **/
/************************/

buildscript {
    // Add central and local Maven repos
    repositories {
        jcenter()
        mavenLocal()
    }
    dependencies {
        // MOE plugin
        classpath group: 'org.multi-os-engine', name: 'moe-gradle', version: '1.7.+'
    }
}

/*******************/
/** Project Setup **/
/*******************/

// Apply plugins
apply plugin: 'moe'

// Set source and target to Java 8
sourceCompatibility = "1.8"
targetCompatibility = "1.8"

// Set maven repository

// Exclude all files from Gradle's test runner
test { exclude '**' }

// Setup MOE
moe {
    xcode {
        project 'xcode/Domination.xcodeproj'
        mainTarget = 'Domination'
        testTarget = 'Domination-Test'
    }
    //xcode.packageName = 'net.yura.domination'
    //xcode.launchScreenFilePath = 'src/main/resources/LaunchScreen.xib'
    //xcode.bundleID = 'net.Domination'
    //xcode.generateProject = false
    //xcode.xcodeProjectDirPath = 'xcode'
}

// Set dependencies
dependencies {
    implementation rootProject
    implementation project(":iOSME")
    // Compile with 'jar' files in the project's 'lib' directory
    implementation fileTree(dir: 'lib', include: '*.jar')
}



